name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tucumaps
          POSTGRES_PASSWORD: tucumaps
          POSTGRES_DB: tucumaps_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tucumaps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tucumaps:tucumaps@localhost:5432/tucumaps_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
