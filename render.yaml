# Blueprint de Render para el backend de TucuMaps.
# En Render: New > Blueprint > elegir este repo. Las variables con sync: false se completan a mano.
services:
  - type: web
    name: tucumaps-api
    runtime: node
    plan: free
    region: ohio # cerca de Neon (us-east-2)
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TERMINOS_VERSION
        value: "1.0"
      # 2 = proxy de Render + rewrite de /api en Vercel (desde el 30/10/2026). Con 1, el
      # rate limiting vería la IP de Vercel para todos los usuarios.
      - key: TRUST_PROXY
        value: "2"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL # rama production de Neon
        sync: false
      - key: FRONTEND_URL # URL de Vercel
        sync: false
      - key: SMTP_HOST
        sync: false
      # Render gratis bloquea 25, 465 y 587: Brevo acepta 2525.
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
